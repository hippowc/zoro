<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zoro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top" style="--wails-draggable: drag">
        <div class="search-box" style="--wails-draggable: drag">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="query" class="query" type="search" placeholder="搜索 zoro…"
                 autocomplete="off" style="--wails-draggable: no-drag" />
          <button id="clear" class="clear-btn" type="button" title="清空" aria-label="清空"
                  style="--wails-draggable: no-drag">×</button>
        </div>
      </header>

      <div id="summary" class="summary"></div>

      <section id="body" class="body is-hidden">
        <ul id="results" class="results" style="--wails-draggable: no-drag"></ul>
        <article id="preview" class="preview" style="--wails-draggable: no-drag"></article>
      </section>

      <footer class="status">
        <span id="status">启动中…</span>
        <span class="hint">↵ 弹出窗口 · ⌘↵ 打开源文件 · ⌘C 复制 · Esc 隐藏</span>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
